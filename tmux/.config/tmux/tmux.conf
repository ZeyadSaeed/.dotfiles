unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g base-index 1
set -g pane-base-index 1

set -g prefix C-a

set -g mouse on

set-window-option -g mode-keys vi
set-option -sg escape-time 10

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"

bind v split-window -h
bind h split-window -v
unbind '"'
unbind %

bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection

set-option -g status-position top

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'kylepeeler/tmux-nightowl'
# prefix + ctrl + s to save
# prefix + ctrl + r to restore
set -g @plugin 'tmux-plugins/tmux-resurrect'
#set -g @plugin 'tmux-plugins/tmux-continuum'

#set -g @resurrect-capture-pane-contents 'on'
#set -g @continuum-restore 'on'
set -g @nightowl-show-left-icon smiley
set -g @nightowl-show-left-sep " "
set -g @nightowl-show-right-sep ""
set -g @nightowl-show-timezone false
set -g @nightowl-show-weather false
set -g @nightowl-show-network false
set -g @nightowl-show-battery false
set -g @nightowl-show-fahrenheit false

run '~/.tmux/plugins/tpm/tpm'
